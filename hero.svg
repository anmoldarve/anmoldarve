<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Anmol Darve — Cybersecurity Analyst, Blue Teamer, Python Programmer. Melbourne, Australia.">
  <title>Anmol Darve — Cybersecurity Analyst · Blue Teamer · Python Programmer</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060D10"/>
      <stop offset="55%" stop-color="#0A1A1F"/>
      <stop offset="100%" stop-color="#0C2A28"/>
    </linearGradient>

    <radialGradient id="bloom" cx="82%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00FF9C" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00FF9C" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#00FF9C" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <linearGradient id="sweepFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FF9C" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00FF9C" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FF9C" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00FF9C" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#4FD1C5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4FD1C5" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scanBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00FF9C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00FF9C" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00FF9C" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="frame"><rect x="0" y="0" width="1200" height="320" rx="14"/></clipPath>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }

      .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.3,1) forwards; }
      .d1 { animation-delay: .15s } .d2 { animation-delay: .35s }
      .d3 { animation-delay: .55s } .d4 { animation-delay: .75s } .d5 { animation-delay: .95s }
      @keyframes rise { from { opacity:0; transform: translateY(14px) } to { opacity:1; transform: none } }

      .draw { stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw 1.1s ease-out .2s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0 } }

      .beam { animation: beam 7s linear infinite; }
      @keyframes beam { from { transform: translateY(-140px) } to { transform: translateY(360px) } }

      .radar { transform-origin: 1005px 160px; animation: spin 5.5s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }

      .ping { opacity: 0; animation: ping 5.5s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .p2 { animation-delay: 1.4s } .p3 { animation-delay: 2.8s } .p4 { animation-delay: 4.1s }
      @keyframes ping {
        0%   { opacity: 0; transform: scale(.4) }
        6%   { opacity: 1; transform: scale(1.4) }
        20%  { opacity: .9; transform: scale(1) }
        70%  { opacity: 0; transform: scale(1) }
        100% { opacity: 0 }
      }

      .trace { stroke-dasharray: 60 940; stroke-dashoffset: 1000; animation: trace 4.2s linear infinite; }
      @keyframes trace { to { stroke-dashoffset: 0 } }

      .live { animation: live 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes live { 0%,100% { opacity:1; transform: scale(1) } 50% { opacity:.35; transform: scale(.8) } }

      .caret { animation: caret 1.1s steps(1) infinite; }
      @keyframes caret { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }

      .drift { animation: drift 22s linear infinite; }
      @keyframes drift { to { transform: translate(-36px, -36px) } }

      @media (prefers-reduced-motion: reduce) {
        .rise, .draw, .beam, .radar, .ping, .trace, .live, .caret, .drift { animation: none; opacity: 1; stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <g class="drift"><rect x="-40" y="-40" width="1280" height="400" fill="url(#grid)"/></g>
    <rect width="1200" height="320" fill="url(#bloom)"/>
    <rect class="beam" x="0" y="0" width="1200" height="140" fill="url(#scanBeam)"/>

    <!-- corner brackets -->
    <g fill="none" stroke="#00FF9C" stroke-opacity=".55" stroke-width="2">
      <path class="draw" d="M28 74V28h46"/>
      <path class="draw" d="M1172 246v46h-46"/>
    </g>

    <!-- left: identity block -->
    <g class="mono">
      <g class="rise d1">
        <rect x="68" y="66" width="11" height="11" fill="#00FF9C" class="live"/>
        <text x="92" y="76" fill="#4FD1C5" font-size="13" letter-spacing="4.5">SECURITY OPERATIONS · MELBOURNE, AU</text>
      </g>

      <text class="rise d2" x="66" y="160" fill="#E6F5EF" font-size="68" font-weight="700" letter-spacing="10" filter="url(#glow)">ANMOL</text>

      <g class="rise d3">
        <text x="70" y="196" fill="#8FA8AF" font-size="17" letter-spacing="1.5">
          Cybersecurity Analyst <tspan fill="#00FF9C">·</tspan> Blue Teamer <tspan fill="#00FF9C">·</tspan> Python Programmer
        </text>
      </g>

      <rect class="rise d3" x="68" y="214" width="470" height="2" fill="url(#rule)"/>

      <g class="rise d4" fill="#6F8A92" font-size="13.5" letter-spacing="1">
        <text x="70" y="248"><tspan fill="#00FF9C">&gt;</tspan> threat hunting · detection engineering · incident response<tspan class="caret" fill="#00FF9C">_</tspan></text>
      </g>

      <g class="rise d5">
        <g fill="none" stroke="#00FF9C" stroke-opacity=".28">
          <rect x="68" y="266" width="120" height="26" rx="13"/>
          <rect x="198" y="266" width="132" height="26" rx="13"/>
          <rect x="340" y="266" width="118" height="26" rx="13"/>
        </g>
        <g fill="#9FBDC0" font-size="11.5" letter-spacing="1.6">
          <text x="84" y="283">SENTINEL</text>
          <text x="214" y="283">SPLUNK · KQL</text>
          <text x="356" y="283">WAZUH</text>
        </g>
      </g>
    </g>

    <!-- right: detection scope -->
    <g class="rise d3">
      <g fill="none" stroke="#00FF9C" stroke-opacity=".18">
        <circle cx="1005" cy="160" r="30"/>
        <circle cx="1005" cy="160" r="58"/>
        <circle cx="1005" cy="160" r="86"/>
        <path d="M905 160h200M1005 60v200" stroke-opacity=".12"/>
      </g>
      <g class="radar">
        <path d="M1005 160 L1091 160 A86 86 0 0 0 1048 85 Z" fill="url(#sweepFade)"/>
        <path d="M1005 160 L1091 160" stroke="#00FF9C" stroke-opacity=".8" stroke-width="1.5"/>
      </g>
      <g fill="#00FF9C">
        <circle class="ping" cx="1042" cy="118" r="3.5"/>
        <circle class="ping p2" cx="966" cy="196" r="3.5"/>
        <circle class="ping p3" cx="1058" cy="192" r="3.5"/>
        <circle class="ping p4" cx="978" cy="128" r="3.5"/>
      </g>
      <circle cx="1005" cy="160" r="3" fill="#E6F5EF"/>
    </g>

    <!-- packet trace along the base -->
    <g fill="none" stroke-width="1.6">
      <path d="M0 306 H300 l12 -10 l14 20 l12 -10 H620 l12 -12 l14 24 l12 -12 H1200"
            stroke="#00FF9C" stroke-opacity=".12"/>
      <path class="trace" d="M0 306 H300 l12 -10 l14 20 l12 -10 H620 l12 -12 l14 24 l12 -12 H1200"
            stroke="#00FF9C" stroke-opacity=".9" filter="url(#glow)"/>
    </g>

    <rect x="0" y="0" width="1200" height="320" rx="14" fill="none" stroke="#00FF9C" stroke-opacity=".16"/>
  </g>
</svg>
