<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-label="Thanks for stopping by">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C2A28"/>
      <stop offset="60%" stop-color="#0A1A1F"/>
      <stop offset="100%" stop-color="#060D10"/>
    </linearGradient>
    <linearGradient id="fline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FF9C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00FF9C" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#00FF9C" stop-opacity="0"/>
    </linearGradient>
    <pattern id="fgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00FF9C" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="fclip"><rect width="1200" height="130" rx="14"/></clipPath>
    <style>
      .fmono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      .flow { stroke-dasharray: 90 1110; stroke-dashoffset: 1200; animation: flow 5s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: 0 } }
      @media (prefers-reduced-motion: reduce) { .blink, .flow { animation: none } }
    </style>
  </defs>
  <g clip-path="url(#fclip)">
    <rect width="1200" height="130" fill="url(#fbg)"/>
    <rect width="1200" height="130" fill="url(#fgrid)"/>
    <rect x="0" y="28" width="1200" height="1.5" fill="url(#fline)"/>
    <g fill="none" stroke="#00FF9C" stroke-width="1.5">
      <path d="M0 104 H420 l12 -18 l14 36 l12 -18 H1200" stroke-opacity=".12"/>
      <path class="flow" d="M0 104 H420 l12 -18 l14 36 l12 -18 H1200" stroke-opacity=".85"/>
    </g>
    <g class="fmono">
      <text x="438" y="72" fill="#E6F5EF" font-size="19" letter-spacing="3.5">
        <tspan fill="#00FF9C">$</tspan> thanks for stopping by<tspan class="blink" fill="#00FF9C">_</tspan>
      </text>
    </g>
    <rect width="1200" height="130" rx="14" fill="none" stroke="#00FF9C" stroke-opacity=".14"/>
  </g>
</svg>
