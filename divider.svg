<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="1200" height="12" role="presentation">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FF9C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4FD1C5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00FF9C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FF9C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00FF9C" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00FF9C" stop-opacity="0"/>
    </linearGradient>
    <style>
      .run { animation: run 5s cubic-bezier(.5,0,.5,1) infinite; }
      @keyframes run { 0% { transform: translateX(-260px) } 100% { transform: translateX(1200px) } }
      @media (prefers-reduced-motion: reduce) { .run { animation: none; opacity: .6 } }
    </style>
  </defs>
  <rect x="0" y="5" width="1200" height="1.5" fill="url(#base)"/>
  <rect class="run" x="0" y="4.5" width="260" height="2.5" rx="1.25" fill="url(#pulse)"/>
</svg>
